# Package metadata and supported Python version used by uv when creating the environment.
[project]
name = "student-mapping-backend"
version = "0.1.0"
description = "FastAPI backend for the student mapping application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime libraries for the API, database access and Excel processing.
# uv.lock records resolved versions; it is generated and should not be annotated by hand.
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    # Preserve Uvicorn transports previously installed through the retired UI.
    "httptools>=0.8.0",
    "websockets>=17.1",
]

[tool.uv]
prerelease = "disallow"
